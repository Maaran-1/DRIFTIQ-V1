# Render blueprint (alternative to Railway) — see DEPLOY.md.
services:
  - type: web
    name: driftiq
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: bash backend/start.sh
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # paste your Neon/Supabase connection string
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: ASR_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
